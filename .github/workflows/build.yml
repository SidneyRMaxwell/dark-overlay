name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'

      - name: Build signed APK
        run: gradle assembleRelease -PversionCode=${{ github.run_number }} --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk DarkOverlay.apk

      - uses: actions/upload-artifact@v5
        with:
          name: DarkOverlay-apk
          path: DarkOverlay.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Dark Overlay v1.${{ github.run_number }}
          files: DarkOverlay.apk
          make_latest: true
